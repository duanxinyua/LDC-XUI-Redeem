<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LDC 兑换结果</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(180deg, #f0f4f8 0%, #d9e2ec 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            width: 100%;
            max-width: 460px;
            background: white;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
            padding: 36px 28px;
        }
        .header {
            text-align: center;
            margin-bottom: 24px;
        }
        .icon {
            width: 58px;
            height: 58px;
            border-radius: 16px;
            margin: 0 auto 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
        }
        h1 {
            font-size: 22px;
            color: #111827;
            margin-bottom: 8px;
        }
        .subtitle {
            font-size: 14px;
            color: #64748b;
            line-height: 1.6;
        }
        .status {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 18px;
            margin-bottom: 20px;
        }
        .status-title {
            font-size: 15px;
            font-weight: 600;
            color: #0f172a;
            margin-bottom: 8px;
        }
        .status-text {
            font-size: 14px;
            color: #475569;
            line-height: 1.6;
        }
        .status.processing {
            border-color: #bae6fd;
            background: #f0f9ff;
        }
        .status.success {
            border-color: #86efac;
            background: #f0fdf4;
        }
        .status.error {
            border-color: #fca5a5;
            background: #fef2f2;
        }
        .spinner {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 2.5px solid #dbeafe;
            border-top-color: #0ea5e9;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 10px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .result {
            display: none;
            margin-top: 8px;
        }
        .result.show {
            display: block;
        }
        .info-item {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            padding: 12px 0;
            border-bottom: 1px solid #e5f0e5;
            font-size: 14px;
        }
        .info-item:last-of-type {
            border-bottom: none;
        }
        .info-label {
            color: #64748b;
        }
        .info-value {
            color: #0f172a;
            font-weight: 500;
            text-align: right;
            word-break: break-all;
        }
        .copy-section {
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px dashed #86efac;
        }
        .copy-section label {
            display: block;
            margin-bottom: 10px;
            color: #475569;
            font-size: 13px;
        }
        .copy-row {
            display: flex;
            gap: 10px;
        }
        .copy-row input {
            flex: 1;
            padding: 12px 14px;
            border: 1px solid #86efac;
            border-radius: 10px;
            font-size: 13px;
        }
        .copy-row button,
        .actions a,
        .actions button {
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
        }
        .copy-row button {
            padding: 12px 16px;
            background: #22c55e;
            color: white;
        }
        .actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .actions a,
        .actions button {
            flex: 1;
            text-align: center;
            padding: 14px 16px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
        }
        .btn-secondary {
            background: #e2e8f0;
            color: #334155;
        }
        .toast {
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: #111827;
            color: white;
            padding: 12px 22px;
            border-radius: 10px;
            display: none;
        }
        .toast.show {
            display: block;
        }
        @media (max-width: 520px) {
            .card {
                padding: 28px 20px;
            }
            .copy-row,
            .actions {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <div class="icon">⚡</div>
            <h1>LDC 兑换处理中</h1>
            <p class="subtitle">订单号：<span id="orderNo">{{ order_no }}</span></p>
        </div>

        <div class="status processing" id="statusBox">
            <div class="spinner" id="spinner"></div>
            <div class="status-title" id="statusTitle">正在确认支付状态</div>
            <div class="status-text" id="statusText">支付成功后会自动为你生成订阅链接，通常只需要几秒钟。</div>
        </div>

        <div class="result" id="resultBox"></div>

        <div class="actions">
            <button class="btn-secondary" id="refreshBtn" type="button">刷新状态</button>
            <a class="btn-primary" href="/">返回首页</a>
        </div>
    </div>

    <div class="toast" id="toast">已复制到剪贴板</div>

    <script>
        const orderNo = {{ order_no | tojson }};
        const statusBox = document.getElementById('statusBox');
        const statusTitle = document.getElementById('statusTitle');
        const statusText = document.getElementById('statusText');
        const spinner = document.getElementById('spinner');
        const resultBox = document.getElementById('resultBox');
        const refreshBtn = document.getElementById('refreshBtn');
        let pollTimer = null;
        let pollCount = 0;

        function setStatus(type, title, text, spinning = false) {
            statusBox.className = `status ${type}`;
            statusTitle.textContent = title;
            statusText.textContent = text;
            spinner.style.display = spinning ? 'block' : 'none';
        }

	        function createInfoItem(label, value) {
	            const item = document.createElement('div');
	            item.className = 'info-item';

	            const labelNode = document.createElement('span');
	            labelNode.className = 'info-label';
	            labelNode.textContent = label;

	            const valueNode = document.createElement('span');
	            valueNode.className = 'info-value';
	            valueNode.textContent = value || '-';

	            item.append(labelNode, valueNode);
	            return item;
	        }

	        function createCopySection(subUrl) {
	            const section = document.createElement('div');
	            section.className = 'copy-section';

	            const label = document.createElement('label');
	            label.textContent = '订阅链接';

	            const row = document.createElement('div');
	            row.className = 'copy-row';

	            const input = document.createElement('input');
	            input.type = 'text';
	            input.value = subUrl || '';
	            input.readOnly = true;

	            const button = document.createElement('button');
	            button.type = 'button';
	            button.textContent = '复制';
	            button.addEventListener('click', () => copyToClipboard(subUrl || ''));

	            row.append(input, button);
	            section.append(label, row);
	            return section;
	        }

	        function renderResult(data) {
	            resultBox.replaceChildren(
	                createInfoItem('订单号', data.order_no || orderNo),
	                createInfoItem('用户标识', data.email),
	                createInfoItem('节点', data.inbound_name),
	                createInfoItem('流量限额', data.traffic_limit),
	                createInfoItem('有效期', `${data.expire_days || '-'} 天`),
	                createCopySection(data.sub_url)
	            );
	            resultBox.classList.add('show');
	        }

        async function fetchOrderStatus() {
            pollCount += 1;

            try {
                const response = await fetch(`/ldc/order/${encodeURIComponent(orderNo)}`);
                const data = await response.json();

                if (data.success && data.status === 'completed') {
                    clearTimeout(pollTimer);
                    setStatus('success', '兑换成功', '订阅已经创建完成，可以直接复制使用。');
                    renderResult(data.data);
                    return;
                }

                if (data.status === 'failed' || data.status === 'missing') {
                    clearTimeout(pollTimer);
                    setStatus('error', '兑换失败', data.msg || '订单处理失败，请联系管理员。');
                    return;
                }

                setStatus('processing', '正在确认支付状态', data.msg || '支付已提交，等待平台确认。', true);

                if (pollCount < 30) {
                    pollTimer = setTimeout(fetchOrderStatus, 2500);
                } else {
                    setStatus('processing', '等待支付确认', '状态同步稍慢，请点击“刷新状态”再次检查。', false);
                }
            } catch (error) {
                setStatus('error', '网络异常', '状态查询失败，请点击“刷新状态”重试。');
            }
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                const toast = document.getElementById('toast');
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 1800);
            });
        }

        refreshBtn.addEventListener('click', () => {
            clearTimeout(pollTimer);
            pollCount = 0;
            setStatus('processing', '正在确认支付状态', '正在重新查询订单状态，请稍候。', true);
            fetchOrderStatus();
        });

        fetchOrderStatus();
    </script>
</body>
</html>
