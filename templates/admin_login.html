<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理登录</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-1: #f7fafc;
            --bg-2: #e2ecf6;
            --text: #0f172a;
            --muted: #64748b;
            --line: rgba(15, 23, 42, 0.08);
            --accent: #4facfe;
            --accent-2: #00f2fe;
        }
        body {
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at 12% 18%, rgba(79, 172, 254, 0.16), transparent 28%),
                radial-gradient(circle at 86% 20%, rgba(0, 242, 254, 0.14), transparent 24%),
                radial-gradient(circle at 74% 82%, rgba(15, 23, 42, 0.08), transparent 26%),
                linear-gradient(180deg, var(--bg-1) 0%, var(--bg-2) 100%);
        }
        .page {
            min-height: 100vh;
            width: 100%;
            padding: 28px clamp(18px, 4vw, 72px);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .brand-icon {
            width: 56px;
            height: 56px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 18px;
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
            color: white;
            font-size: 26px;
            box-shadow: 0 16px 32px rgba(79, 172, 254, 0.22);
        }
        .auth {
            width: 100%;
            max-width: 560px;
        }
        .auth-top {
            display: grid;
            justify-items: center;
            gap: 12px;
            margin-bottom: 30px;
            text-align: center;
        }
        .auth-title {
            font-size: clamp(28px, 4vw, 42px);
            color: var(--text);
            font-weight: 800;
            letter-spacing: -0.04em;
            line-height: 1.08;
            white-space: nowrap;
        }
        .auth-subtitle {
            color: #475569;
            font-size: 14px;
            line-height: 1.7;
            max-width: 440px;
        }
        .back-link a {
            color: #475569;
            text-decoration: none;
            font-size: 14px;
        }
        .back-link a:hover {
            color: var(--accent);
        }
        .login-form {
            display: grid;
            gap: 18px;
        }
        .input-group {
            display: grid;
            gap: 8px;
        }
        .input-group label {
            font-size: 13px;
            color: #475569;
            font-weight: 600;
            letter-spacing: 0.01em;
        }
        .input-group input {
            width: 100%;
            padding: 16px 18px;
            border: 1.5px solid rgba(15, 23, 42, 0.12);
            border-radius: 16px;
            font-size: 16px;
            background: rgba(255, 255, 255, 0.72);
            color: var(--text);
            backdrop-filter: blur(10px);
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
        }
        .input-group input:focus {
            outline: none;
            border-color: rgba(79, 172, 254, 0.7);
            box-shadow: 0 0 0 4px rgba(79, 172, 254, 0.14);
            background: rgba(255, 255, 255, 0.88);
        }
        .turnstile-box {
            width: 100%;
            min-height: 94px;
            padding: 14px;
            border: 1px solid rgba(15, 23, 42, 0.10);
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.62);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            backdrop-filter: blur(10px);
        }
        .hint {
            color: var(--muted);
            font-size: 12px;
            line-height: 1.6;
            margin-top: -6px;
        }
        .error-msg {
            display: none;
            padding: 14px 16px;
            border-radius: 14px;
            background: rgba(254, 242, 242, 0.86);
            color: #dc2626;
            border: 1px solid rgba(248, 113, 113, 0.22);
            font-size: 14px;
        }
        .btn {
            width: 100%;
            padding: 16px 18px;
            border: none;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s;
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
            color: white;
            box-shadow: 0 18px 30px rgba(79, 172, 254, 0.24);
        }
        .btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 22px 34px rgba(79, 172, 254, 0.28);
        }
        .btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .footnote {
            margin-top: 18px;
            color: #64748b;
            font-size: 12px;
            line-height: 1.6;
            text-align: center;
        }
        @media (max-width: 980px) {
            .auth {
                max-width: 580px;
            }
        }
        @media (max-width: 640px) {
            .page {
                padding: 20px 14px 28px;
            }
            .auth-title {
                white-space: normal;
            }
            .turnstile-box {
                min-height: 88px;
            }
            .input-group input,
            .btn {
                border-radius: 14px;
            }
        }
    </style>
</head>
<body>
    <main class="page">
        <section class="auth" aria-label="登录表单">
            <div class="auth-top">
                <span class="brand-icon">⚡</span>
                <div class="auth-title">管理员登录</div>
                <div class="auth-subtitle">登录后可管理兑换码、LDC 订单、节点设置和用户数据。</div>
                <div class="back-link">
                    <a href="/">← 返回用户页面</a>
                </div>
            </div>

            <div class="error-msg" id="errorMsg"></div>

            <form id="loginForm" class="login-form">
                <div class="input-group">
                    <label>用户名</label>
                    <input type="text" id="username" name="username" required autocomplete="username">
                </div>
                <div class="input-group">
                    <label>密码</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password">
                </div>
                {% if turnstile_enabled %}
                <div class="turnstile-box" id="loginTurnstile"></div>
                <div class="hint">登录前请完成人机验证。</div>
                {% endif %}
                <button type="submit" class="btn">登 录</button>
            </form>

            <div class="footnote">
                登录成功后将进入后台首页。若验证组件加载异常，请稍后重试或暂时关闭 Turnstile。
            </div>
        </section>
    </main>

    {% if turnstile_enabled %}
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
    {% endif %}
    <script>
        const csrfToken = {{ csrf_token | tojson }};
        const turnstileEnabled = {{ turnstile_enabled | tojson }};
        const turnstileSiteKey = {{ turnstile_site_key | tojson }};
        let loginTurnstileWidget = null;

        function renderLoginTurnstile() {
            const target = document.getElementById('loginTurnstile');
            if (turnstileEnabled && target && window.turnstile && !loginTurnstileWidget) {
                loginTurnstileWidget = window.turnstile.render(target, {
                    sitekey: turnstileSiteKey,
                    theme: 'light',
                    size: 'flexible'
                });
            }
        }

        function getLoginTurnstileToken() {
            if (!turnstileEnabled) {
                return '';
            }
            if (!window.turnstile || !loginTurnstileWidget) {
                return '';
            }
            return window.turnstile.getResponse(loginTurnstileWidget) || '';
        }

        function resetLoginTurnstile() {
            if (turnstileEnabled && window.turnstile && loginTurnstileWidget) {
                window.turnstile.reset(loginTurnstileWidget);
            }
        }

        if (turnstileEnabled) {
            const turnstileTimer = setInterval(() => {
                if (window.turnstile) {
                    renderLoginTurnstile();
                    clearInterval(turnstileTimer);
                }
            }, 120);
        }

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');
            const turnstileToken = getLoginTurnstileToken();
            if (turnstileEnabled && !turnstileToken) {
                errorMsg.textContent = '请先完成人机验证';
                errorMsg.style.display = 'block';
                return;
            }

            const formData = new FormData();
            formData.append('_csrf_token', csrfToken);
            formData.append('username', username);
            formData.append('password', password);
            formData.append('cf-turnstile-response', turnstileToken);

            try {
                const response = await fetch('/admin/login', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (data.success) {
                    window.location.href = '/admin';
                } else {
                    errorMsg.textContent = data.msg;
                    errorMsg.style.display = 'block';
                    resetLoginTurnstile();
                }
            } catch (error) {
                errorMsg.textContent = '网络错误';
                errorMsg.style.display = 'block';
                resetLoginTurnstile();
            }
        });
    </script>
</body>
</html>
